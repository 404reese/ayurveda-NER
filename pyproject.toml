[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "ayurner"
version = "0.1.0"
description = "Named-entity recognition for Ayurvedic terms in Sanskrit and Hindi (Devanagari and romanized)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Riddhesh" }]
keywords = ["ayurveda", "ner", "sanskrit", "hindi", "devanagari", "nlp", "gazetteer"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Hindi",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "indic-transliteration>=2.3",
    "tomli>=2.0; python_version<'3.11'",
]

[project.optional-dependencies]
fuzzy = ["rapidfuzz>=3.0"]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "pydantic>=2.5"]
pdf = ["pypdf>=4.0"]
ui = ["streamlit>=1.57", "pandas"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5", "rapidfuzz>=3.0", "fastapi>=0.110", "pypdf>=4.0"]

[project.scripts]
ayurner = "ayurner.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ayurner"]

[tool.hatch.build.targets.sdist]
include = ["src/ayurner", "tests", "scripts", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
